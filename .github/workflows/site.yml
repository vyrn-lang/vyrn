name: Site

# Build the website and publish it to GitHub Pages.
#
# WHERE THE SITE'S DATA COMES FROM. The design brief proposed a set of
# `site/data/*.json` files gathered by this job. Most of them turned out to be
# unnecessary, and one of them would have been dishonest:
#
#   - Counts (examples, RFCs, std modules) are read off the repository by a
#     compile-time generator, `site/app/facts.vyrn`, while the pages render.
#     There is nothing to gather and nothing to go stale.
#   - The release IS baked, into `site/release.txt`, by the step below — one
#     call to the release listing before the pages render, and the committed
#     file whenever that call is unavailable. The page then knows its own
#     version and prints the real install command instead of telling every
#     reader to build from source.
#   - Benchmarks are measured, not gathered: `bench/engines.sh` times one
#     program on all three engines, and the comparison page publishes the
#     machine, the date, the version and the command beside the numbers. The
#     per-operation `vyrn bench` corpus stays out of the site until
#     `bench/baseline.json` is seeded, because a trend needs a baseline.
on:
  release:
    types: [published, prereleased, edited]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  # BEFORE MERGE, not after. `ci.yml` never touches `site/`, and this workflow
  # used to run only on things that happen after a commit is already on main —
  # so a pull request breaking any site module merged green and turned the Pages
  # deploy red afterwards, with the tree already broken for everyone. The build
  # job runs on the PR; `deploy` and the artifact upload do not (a fork's token
  # cannot write Pages, and a PR has nothing to publish).
  pull_request:
    paths:
      - 'site/**'
      - 'std/**'
      - 'web/**'
      - 'compiler/**'
      - 'examples/**'
      # The site's one build input is written by a script in here.
      - 'scripts/**'
      - '.github/workflows/site.yml'
  schedule:
    # One daily run, as a safety net for a missed trigger.
    - cron: '17 6 * * *'

# Least privilege, per job. The build job compiles and runs PR-supplied code,
# and pull_request runs take this file from the merge ref — a PR can ship its
# own copy of it — so the workflow-wide grant stops at reads. pages/id-token
# are declared on the deploy job alone, which never runs on a pull request.
permissions:
  contents: read

# One deployment at a time; a superseded build is not worth publishing. Keyed by
# ref rather than a bare `pages`, so a pull-request build cannot cancel the
# main-line deploy it has nothing to do with.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    # A CI run that failed does not get published.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # For workflow_run events github.sha is the default branch's CURRENT
          # head, not the commit the CI run validated: push A then B quickly and
          # this fires on A's green run while HEAD is already B. Check out the
          # sha CI actually passed. On every other event the expression is empty
          # and checkout falls back to github.sha, as before.
          ref: ${{ github.event.workflow_run.head_sha }}
          # The whole history, and the tags with it. The backstage draws the
          # project's pulse — commits and merged pull requests per day, when
          # each design record arrived, when each release was tagged — and the
          # default single-commit checkout has none of that to count
          # (RFC-0105 M1).
          fetch-depth: 0

      - name: Rust cache
        # The pattern `ci.yml` already uses, and for the reason recorded there:
        # rust-cache refreshes the saved target dir per run and prunes stale
        # artifacts, where `actions/cache` on a lockfile key never re-uploads
        # after the first hit. Its own slot, because this job builds two
        # workspaces neither test job builds — `vyrn-play` for wasm, which is not
        # in the workspace at all.
        #
        # WHERE THE TIME GOES, measured on run 32440081819 (17m23s): the CLI
        # build 62 s, the playground's wasm build 25 s and its host tests 45 s —
        # 132 s of cargo, which is what this step removes on a warm run. The pole
        # is not a build. `The site's own tests` is 907 s of it, and 687 s of THAT
        # is `vyrn test site/export.vyrn`: 32 blocks, most of which render pages,
        # against 175 routes. That number belongs to the interpreter and not to
        # this file, and it is the next thing to attack here.
        # Swatinem/rust-cache@v2
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            compiler
            compiler/vyrn-play
          prefix-key: site

      - name: Build the CLI
        working-directory: compiler
        run: cargo build --release -p vyrn-cli

      - name: The repository's own history
        # BEFORE the export, which refuses to publish without this file — see
        # `missingHistory` in `site/export.vyrn`. The export reads the working
        # tree and nothing else (RFC-0014 has `readFile` and `listDir`, and no
        # git), so the one input it is handed is written here, by a script in
        # the repository that anybody can run for a local build.
        run: |
          mkdir -p site/data
          python3 scripts/site-history.py > site/data/history.json
          wc -c site/data/history.json

      - name: Refresh the baked release
        # `site/release.txt` holds the newest published tag and its date, and a
        # compile-time generator reads it into every page that names a version.
        # This is where it is kept fresh: the listing endpoint (not
        # `/releases/latest`, which hides pre-releases), one call, with the
        # workflow's own token so the anonymous 60-an-hour limit is not in play.
        #
        # It CANNOT fail the build. A rate limit, an outage, or a fork whose
        # token cannot read the API leaves the committed file exactly as it is —
        # the pages still render, with the last tag anyone recorded. The
        # export itself never touches the network.
        #
        # The comment header of the file is preserved and the two data lines are
        # replaced, so the file keeps explaining itself.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fresh=$(gh api "repos/${{ github.repository }}/releases?per_page=1" \
            --jq 'if length == 0 then "" else "\(.[0].tag_name)\n\(.[0].published_at | split("T")[0])" end') || fresh=''
          case "$fresh" in
            v*)
              { grep '^#' site/release.txt; printf '%s\n' "$fresh"; } > site/release.new
              mv site/release.new site/release.txt
              echo "baked release:"; grep -v '^#' site/release.txt ;;
            *)
              echo "no release data from the API; keeping the committed file:"
              grep -v '^#' site/release.txt ;;
          esac

      - name: The output directories
        # RFC-0014 has no way to CREATE a directory, and the reference publishes
        # one page per std module, the guide one per chapter, the backstage one
        # per design record, and the registry one per package.
        run: mkdir -p out/docs/std out/guide out/web out/tooling out/backstage/rfcs out/explore

      - name: A minute with Vyrn, recorded
        # AFTER the CLI build, because it runs the binary that step just made,
        # and BEFORE the export, which refuses to publish without this file —
        # see `missingDemo` in `site/export.vyrn`.
        #
        # AND BEFORE THE TEST LOOP, which is fifteen minutes long. This step used
        # to sit under it: when it broke, the job spent seventeen minutes getting
        # to the failure. Every input the export needs is now written in the first
        # two, so a broken input says so while a reader is still watching. Seven steps in a scratch
        # directory: `vyrn new`, the files it wrote, `vyrn run`, one edit,
        # `vyrn test`, `vyrn build`, and the binary. Every line of output on the
        # index came out of this run (RFC-0106 M2).
        run: |
          python3 scripts/site-demo.py --vyrn compiler/target/release/vyrn > site/data/demo.json
          wc -c site/data/demo.json

      - name: The site's own tests
        # The export asserts that every navigation row points at a route that
        # exists and that every route answers as a document AND as data. The
        # other modules check the highlighter, the chart geometry and the
        # repository counts.
        #
        # A GLOB, not a list. The list named thirteen files while `site/app/`
        # held fourteen modules, so `hl.vyrn` (6 test blocks — the highlighter
        # this step's own comment claimed was checked) and `facts.vyrn` (3) ran
        # nowhere. The `fmt` step two steps down already globs; a list of what to
        # check is a list somebody has to remember to add to.
        #
        # And `vyrn test` on a file with no test blocks prints "no tests" and
        # exits 0, so a module that silently stopped being discovered would keep
        # this loop green. The floor is therefore read off the SOURCE — the same
        # rule `compiler/vyrn-cli/tests/std_suite.rs` applies to `std/` — so a
        # block that stops running fails here with both numbers in the message.
        # THE EXPORT FIRST, THEN THE MODULES. This step was 1392 s of a 1788 s
        # job. It ran four at a time for a while, which was a workaround: the
        # cost was never the queue, it was that the site's own modules re-read
        # their source files and recomputed their layouts on every accessor
        # call. With those memoised the whole module loop is 20 s serial, so the
        # parallel machinery is gone and this is a loop again. The export still
        # goes first because it warms the generator cache under `~/.vyrn`, which
        # every module below then shares.
        #
        # The floor is read off the SOURCE, per file — the same rule
        # `compiler/vyrn-cli/tests/std_suite.rs` applies to `std/` — so a block
        # that stops being discovered fails here with both numbers.
        run: |
          set -euo pipefail
          bin=compiler/target/release/vyrn
          total=0
          for f in site/export.vyrn site/app/*.vyrn; do
            declared=$(grep -c '^test "' "$f" || true)
            [ "$declared" -eq 0 ] && continue
            out=$("$bin" test "$f" 2>&1) || { echo "== $f"; echo "$out"; exit 1; }
            ran=$(printf '%s' "$out" | awk '/passed, 0 failed$/ {n=$1} END {print n+0}')
            if [ "${ran:-0}" -lt "$declared" ]; then
              echo "$f: $declared blocks declared, ${ran:-0} ran"
              echo "$out"
              exit 1
            fi
            echo "ran $f $ran"
            total=$((total + ran))
          done
          echo "site: $total test blocks ran"
      - name: The guide's programs
        # Every code block in the guide is a file here, and the export imports
        # and CALLS each one while it renders the pages — so a program that does
        # not compile already fails the build. This runs their own `test` blocks
        # as well, which is the half the export does not exercise.
        run: |
          bin=compiler/target/release/vyrn
          for f in site/guide/*.vyrn; do
            "$bin" test "$f"
          done

      - name: Formatting
        run: compiler/target/release/vyrn fmt --check site/app/*.vyrn site/guide/*.vyrn site/export.vyrn

      - name: The playground module
        # The compiler's own front end, as WebAssembly (`compiler/vyrn-play`).
        # It is EXCLUDED from the workspace and must be built from its own
        # directory: `.cargo/config.toml` there sets the linker's stack size,
        # and cargo reads that file from the working directory upward, so a
        # `--manifest-path` build from elsewhere silently gets wasm-ld's 1 MB
        # default and overflows a tenth of the way to the interpreter's limit.
        #
        # `writeFile` takes a String, so the export cannot copy a wasm module;
        # this one lands straight in the output.
        working-directory: compiler/vyrn-play
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown
          mkdir -p ../../out
          cp target/wasm32-unknown-unknown/release/vyrn_play.wasm ../../out/play.wasm
          ls -l ../../out/play.wasm

      - name: The playground's own checks
        # The span offsets, the diagnostics shape and the exit codes, on the
        # host where a failure is readable.
        working-directory: compiler/vyrn-play
        run: cargo test --release

      - name: Render every page
        # One `route()` call per path, twice: the document and the soft-
        # navigation payload beside it. The stylesheet, the three site scripts
        # and the three browser runtimes are copied by the same program. The
        # reference pages are read off `std/` by a generator while this runs.
        run: compiler/target/release/vyrn run site/export.vyrn out

      - name: The site's node tests
        # Two of them, both over the tree the step above just wrote.
        #
        # `importline.test.mjs` takes the `import` line off every package page,
        # writes each one into a program of its own and runs `vyrn check` on it,
        # so a line a reader would copy cannot ship unless it builds (RFC-0105
        # M2). It needs the release binary the first step built.
        #
        # `basepath.test.mjs`: the export asserts that every internal link
        # resolves, and used to assert it at a root — which is why the site
        # shipped with `/style.css` on every page and 404ed under
        # `https://vyrn-lang.github.io/vyrn/`.
        # This serves `out/` behind a prefix and FETCHES: every page, every URL
        # every page names, both wasm modules, and every fragment. Three mount
        # points, one of them nested, plus `file://`, and the same artifact each
        # time — nothing is rebuilt between them, which is the claim.
        #
        # They have to run here rather than beside the other node tests in
        # `ci.yml`: what they check is the exported tree, and this is the job
        # that has one. A glob, so the next file lands in CI by being written.
        run: node --test "site/test/*.test.mjs"

        # actions/upload-pages-artifact@v3
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        # Nothing to upload from a pull request — the build IS the check there.
        if: github.event_name != 'pull_request'
        with:
          path: out

  deploy:
    needs: build
    # A pull request builds the site and runs its tests; it does not publish it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        # actions/deploy-pages@v4
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
