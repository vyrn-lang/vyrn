name: Site

# Builds the website and publishes it to GitHub Pages.
#
# The site's data is read off the repository while the pages render
# (`site/app/facts.vyrn` counts examples and std modules), or written by a step
# below: the git history, the recorded demo and the baked release. The export
# itself never touches the network.
on:
  release:
    types: [published, prereleased, edited]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  # A pull request that breaks a site module fails here, before merge. No path
  # filter, because `main` requires `build`. `deploy` and the artifact upload
  # skip pull requests: a fork's token cannot write Pages.
  pull_request:
  schedule:
    # A daily run, as a safety net for a missed trigger.
    - cron: '17 6 * * *'

# Least privilege. The build job compiles and runs PR-supplied code, and a
# pull_request run takes this file from the merge ref, so the workflow-wide
# grant is read-only. `pages` and `id-token` are on the deploy job alone, which
# never runs on a pull request.
permissions:
  contents: read

# One deployment at a time. Keyed by ref, so a pull-request build cannot cancel
# the main-line deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    # A failed CI run is not published.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # On workflow_run, github.sha is the default branch's current head,
          # which can be newer than the commit CI passed; check out the sha CI
          # validated. On every other event this is empty and checkout uses
          # github.sha.
          ref: ${{ github.event.workflow_run.head_sha }}
          # The whole history and its tags: the site draws commits, merged pull
          # requests and releases per day.
          fetch-depth: 0

      - name: Rust cache
        # rust-cache, as in `ci.yml`: it refreshes the saved target dir per run
        # and prunes stale artifacts, where `actions/cache` on a lockfile key
        # never re-uploads after the first hit. A slot of its own, because this
        # job also builds `vyrn-play`, which is outside the workspace.
        # Measured on run 32440081819: 132 s of cargo, which a warm cache
        # saves. The test step below dominates the job.
        # Swatinem/rust-cache@v2
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            compiler
            compiler/vyrn-play
          prefix-key: site

      - name: Build the CLI
        working-directory: compiler
        run: cargo build --release -p vyrn-cli

      - name: The repository's own history
        # Before the export, which refuses to publish without this file
        # (`missingHistory` in `site/export.vyrn`). A Vyrn program has no git,
        # so the history is written here by a script anyone can run locally.
        run: |
          mkdir -p site/data
          python3 scripts/site-history.py > site/data/history.json
          wc -c site/data/history.json

      - name: Refresh the baked release
        # `site/release.txt` holds the newest published tag and its date, which
        # every page that names a version reads. One call to the listing
        # endpoint (not `/releases/latest`, which hides pre-releases), with the
        # workflow's token to avoid the anonymous rate limit.
        #
        # It cannot fail the build: on a rate limit, an outage or a fork token
        # that cannot read the API, the committed file stays as it is. An empty
        # listing clears the tag and date, and the pages render the
        # nothing-released state. The file's comment header is kept and its two
        # data lines replaced.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fresh=$(gh api "repos/${{ github.repository }}/releases?per_page=1" \
            --jq 'if length == 0 then "none" else "\(.[0].tag_name)\n\(.[0].published_at | split("T")[0])" end') || fresh=''
          case "$fresh" in
            v*)
              { grep '^#' site/release.txt; printf '%s\n' "$fresh"; } > site/release.new
              mv site/release.new site/release.txt
              echo "baked release:"; grep -v '^#' site/release.txt ;;
            none)
              grep '^#' site/release.txt > site/release.new
              mv site/release.new site/release.txt
              echo "no release is published; baked none" ;;
            *)
              echo "no release data from the API; keeping the committed file:"
              grep -v '^#' site/release.txt ;;
          esac

      - name: The output directories
        # A Vyrn program cannot create a directory, and the export writes one
        # page per std module, guide chapter and registry package.
        run: mkdir -p out/docs/std out/guide out/web out/tooling out/explore

      - name: The native route's two tools, for programs outside this checkout
        # A test that builds natively does it in a scratch project, which pins
        # nothing, so this checkout's `vyrn.lock` cannot answer there. The paths
        # are exported once, read off the compiler's own resolution of the pin.
        run: |
          set -eu
          compiler/target/release/vyrn update --locked wabt >/dev/null
          compiler/target/release/vyrn update --locked simde >/dev/null
          wasm2c=$(compiler/target/release/vyrn deps | awk '$1 == "wasm2c" { print $2 }')
          simde=$(compiler/target/release/vyrn deps | awk '$1 == "simde" { print $2 }')
          [ -n "$wasm2c" ] && [ -n "$simde" ] || { echo "the pins did not resolve: wasm2c='$wasm2c' simde='$simde'" >&2; exit 1; }
          echo "VYRN_WASM2C=$wasm2c" >> "$GITHUB_ENV"
          echo "VYRN_SIMDE=$simde" >> "$GITHUB_ENV"
      - name: A minute with Vyrn, recorded
        # After the CLI build, because it runs that binary, and before the
        # export, which refuses to publish without this file (`missingDemo` in
        # `site/export.vyrn`). Before the long test step too, so a broken input
        # fails early. Seven steps in a scratch directory: `vyrn new`, the files
        # it wrote, `vyrn run`, one edit, `vyrn test`, `vyrn build`, and the
        # binary. Every line of output on the index comes from this run.
        run: |
          python3 scripts/site-demo.py --vyrn compiler/target/release/vyrn > site/data/demo.json
          wc -c site/data/demo.json

      - name: The site's own tests
        # The export checks that every navigation row points at a route that
        # exists and that every route answers as a document and as data; the
        # modules check the highlighter, the chart geometry and the counts.
        #
        # A glob, so a new module is tested without editing this list. A file
        # with no test blocks prints "no tests" and exits 0, so the floor is the
        # number of blocks declared in the source, per file (the rule
        # `compiler/vyrn-cli/tests/std_suite.rs` applies to `std/`): a block
        # that stops being discovered fails with both numbers.
        #
        # The export runs first because it warms the generator cache under
        # `~/.vyrn`, which every module after it shares.
        run: |
          set -euo pipefail
          bin=compiler/target/release/vyrn
          total=0
          for f in site/export.vyrn site/app/*.vyrn; do
            declared=$(grep -c '^test "' "$f" || true)
            [ "$declared" -eq 0 ] && continue
            out=$("$bin" test "$f" 2>&1) || { echo "== $f"; echo "$out"; exit 1; }
            ran=$(printf '%s' "$out" | awk '/passed, 0 failed$/ {n=$1} END {print n+0}')
            if [ "${ran:-0}" -lt "$declared" ]; then
              echo "$f: $declared blocks declared, ${ran:-0} ran"
              echo "$out"
              exit 1
            fi
            echo "ran $f $ran"
            total=$((total + ran))
          done
          echo "site: $total test blocks ran"
      - name: The guide's programs
        # Every code block in the guide is a file here, and the export imports
        # and calls each one, so a program that does not compile fails the
        # build. This runs their own `test` blocks, which the export does not.
        run: |
          bin=compiler/target/release/vyrn
          for f in site/guide/*.vyrn; do
            "$bin" test "$f"
          done

      - name: The markup rules
        # `std/vyx-hints` checks every `.vyx` file for the markup defects
        # html-validate names (a `th` with no `scope`, a `tr` directly in a
        # `table`, an inline `style`, an `input` with no `type`, and others).
        # The rules are errors. A program of its own, so a broken template fails
        # this step and not the export. It prints the number of files it
        # checked, so a file that stops being discovered shows as a smaller
        # number.
        run: compiler/target/release/vyrn run site/markup.vyrn

      - name: Formatting
        run: compiler/target/release/vyrn fmt --check site/app/*.vyrn site/guide/*.vyrn site/export.vyrn site/markup.vyrn

      - name: The playground module
        # The compiler's front end as WebAssembly (`compiler/vyrn-play`). It is
        # outside the workspace and is built from its own directory: its
        # `.cargo/config.toml` sets the linker's stack size, and cargo reads that
        # file from the working directory upward. A `--manifest-path` build from
        # elsewhere gets wasm-ld's 1 MB default, which the compiler's recursion
        # overflows on a deeply nested program.
        #
        # The module compiles and does not run: it answers with the program's
        # own wasm module, which the page runs with `web/wasi-min.js`.
        #
        # `writeFile` takes a String, so the export cannot copy a wasm module;
        # this step puts it in the output.
        working-directory: compiler/vyrn-play
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown
          mkdir -p ../../out
          cp target/wasm32-unknown-unknown/release/vyrn_play.wasm ../../out/play.wasm
          ls -l ../../out/play.wasm

      - name: The playground's own checks
        # Span offsets, the diagnostics shape, and which answer `play_compile`
        # gives, on the host where a failure is readable. What the emitted
        # module does is the parity suite's concern in `vyrn-cli`.
        working-directory: compiler/vyrn-play
        run: cargo test --release

      - name: Render every page
        # One `route()` call per path, twice: the document and the
        # soft-navigation payload beside it. The same program copies the
        # stylesheet, the site scripts and the browser runtimes, and a generator
        # reads the reference pages off `std/`.
        run: compiler/target/release/vyrn run site/export.vyrn out

      - name: The site's node tests
        # They check the tree the step above wrote, which is why they run here
        # and not beside the other node tests in `ci.yml`. Among them:
        # `basepath.test.mjs` serves `out/` under three mount points (one
        # nested) and fetches every page, every URL each page names, both wasm
        # modules and every fragment, and also checks `file://`, all from one
        # unchanged artifact. `installspec.test.mjs` checks that every
        # registry install specifier resolves under the compiler's grammar. A
        # glob, so a new test file runs without editing this step.
        run: node --test "site/test/*.test.mjs"

        # actions/upload-pages-artifact@v5.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        # A pull request builds and tests; it uploads nothing.
        if: github.event_name != 'pull_request'
        with:
          path: out

  deploy:
    needs: build
    # A pull request builds the site and runs its tests; it does not publish.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        # actions/deploy-pages@v5.0.1
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
