name: Site

on:
  release:
    types: [published, prereleased, edited]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '17 6 * * *'

# The build job runs pull-request code, so the grant is read-only; the deploy key is read by `deploy` alone.
permissions:
  contents: read

# Keyed by ref, so a pull-request build cannot cancel the main-line deploy.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # On workflow_run, github.sha can be newer than the commit CI passed.
          ref: ${{ github.event.workflow_run.head_sha }}
          # The whole history: the site draws commits and releases per day.
          fetch-depth: 0

      - name: Rust cache
        # Swatinem/rust-cache@v2
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            compiler
            compiler/vyrn-play
          prefix-key: site

      - name: Build the CLI
        working-directory: compiler
        run: cargo build --release -p vyrn-cli

      - name: The repository's own history
        # Before the export, which refuses to publish without this file.
        run: |
          mkdir -p site/data
          python3 scripts/site-history.py > site/data/history.json
          wc -c site/data/history.json

      - name: Refresh the baked release
        # The listing endpoint, because `/releases/latest` hides pre-releases.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fresh=$(gh api "repos/${{ github.repository }}/releases?per_page=1" \
            --jq 'if length == 0 then "none" else "\(.[0].tag_name)\n\(.[0].published_at | split("T")[0])" end') || fresh=''
          case "$fresh" in
            v*)
              { grep '^#' site/release.txt; printf '%s\n' "$fresh"; } > site/release.new
              mv site/release.new site/release.txt
              echo "baked release:"; grep -v '^#' site/release.txt ;;
            none)
              grep '^#' site/release.txt > site/release.new
              mv site/release.new site/release.txt
              echo "no release is published; baked none" ;;
            *)
              echo "no release data from the API; keeping the committed file:"
              grep -v '^#' site/release.txt ;;
          esac

      - name: The output directories
        run: mkdir -p out/docs/std out/guide out/web out/tooling out/explore

      - name: The native route's two tools, for programs outside this checkout
        run: |
          set -eu
          compiler/target/release/vyrn update --locked wabt >/dev/null
          compiler/target/release/vyrn update --locked simde >/dev/null
          wasm2c=$(compiler/target/release/vyrn deps | awk '$1 == "wasm2c" { print $2 }')
          simde=$(compiler/target/release/vyrn deps | awk '$1 == "simde" { print $2 }')
          [ -n "$wasm2c" ] && [ -n "$simde" ] || { echo "the pins did not resolve: wasm2c='$wasm2c' simde='$simde'" >&2; exit 1; }
          echo "VYRN_WASM2C=$wasm2c" >> "$GITHUB_ENV"
          echo "VYRN_SIMDE=$simde" >> "$GITHUB_ENV"
      - name: A minute with Vyrn, recorded
        # After the CLI build, which it runs, and before the export, which refuses to publish without it.
        run: |
          python3 scripts/site-demo.py --vyrn compiler/target/release/vyrn > site/data/demo.json
          wc -c site/data/demo.json

      - name: The site's own tests
        # The export runs first: it warms the generator cache under `~/.vyrn`.
        run: |
          set -euo pipefail
          bin=compiler/target/release/vyrn
          total=0
          for f in site/export.vyrn site/app/*.vyrn; do
            declared=$(grep -c '^test "' "$f" || true)
            [ "$declared" -eq 0 ] && continue
            out=$("$bin" test "$f" 2>&1) || { echo "== $f"; echo "$out"; exit 1; }
            ran=$(printf '%s' "$out" | awk '/passed, 0 failed$/ {n=$1} END {print n+0}')
            if [ "${ran:-0}" -lt "$declared" ]; then
              echo "$f: $declared blocks declared, ${ran:-0} ran"
              echo "$out"
              exit 1
            fi
            echo "ran $f $ran"
            total=$((total + ran))
          done
          echo "site: $total test blocks ran"
      - name: The guide's programs
        run: |
          bin=compiler/target/release/vyrn
          for f in site/guide/*.vyrn; do
            "$bin" test "$f"
          done

      - name: The markup rules
        run: compiler/target/release/vyrn run site/markup.vyrn

      - name: Formatting
        run: compiler/target/release/vyrn fmt --check site/app/*.vyrn site/guide/*.vyrn site/export.vyrn site/markup.vyrn

      - name: The playground module
        # Built from its own directory: its `.cargo/config.toml` sets the stack size the compiler's recursion needs.
        working-directory: compiler/vyrn-play
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown
          mkdir -p ../../out
          cp target/wasm32-unknown-unknown/release/vyrn_play.wasm ../../out/play.wasm
          ls -l ../../out/play.wasm

      - name: The playground's own checks
        working-directory: compiler/vyrn-play
        run: cargo test --release

      - name: Render every page
        # The fonts are binary, so the workflow copies them, with their licences.
        run: |
          compiler/target/release/vyrn run site/export.vyrn out
          mkdir -p out/fonts
          cp site/fonts/* out/fonts/

      - name: The site's node tests
        # After the export: they check the tree it wrote.
        run: node --test "site/test/*.test.mjs"

      # actions/upload-pages-artifact@v5.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        if: github.event_name != 'pull_request'
        with:
          path: out

  # https://vyrn-lang.github.io/ is the repository vyrn-lang.github.io, served from its `main` branch.
  # This job replaces that branch with one commit holding the build.
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    steps:
      - name: The built site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --name github-pages --dir artifact
          mkdir out
          tar -xf artifact/artifact.tar -C out
          # Without it Pages runs Jekyll, which drops files whose names start with `_`.
          touch out/.nojekyll

      - name: Publish to vyrn-lang.github.io
        env:
          KEY: ${{ secrets.SITE_DEPLOY_KEY }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          cd out
          git init -q -b main
          git add -A
          git -c user.name=vyrn-site -c user.email=vyrn-site@users.noreply.github.com commit -q -m "site at vyrn-lang/vyrn@$SHA"
          git push -q --force git@github.com:vyrn-lang/vyrn-lang.github.io.git main
