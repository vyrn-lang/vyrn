name: Site

# Build the website and publish it to GitHub Pages.
#
# WHERE THE SITE'S DATA COMES FROM. The design brief proposed a set of
# `site/data/*.json` files gathered by this job. Most of them turned out to be
# unnecessary, and one of them would have been dishonest:
#
#   - Counts (examples, RFCs, std modules) are read off the repository by a
#     compile-time generator, `site/app/facts.vyrn`, while the pages render.
#     There is nothing to gather and nothing to go stale.
#   - Releases are fetched by the page itself, once per visit, with an hour of
#     caching (`site/public/fresh.js`). Nothing is baked, so nothing is wrong
#     between builds.
#   - Benchmarks are NOT published, because `bench/baseline.json` is still a
#     placeholder. The comparison page says so rather than printing a number
#     from an unseeded baseline. When the baseline is seeded, this job gains a
#     `gh run download` step and the page gains its chart.
on:
  release:
    types: [published, prereleased, edited]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  # BEFORE MERGE, not after. `ci.yml` never touches `site/`, and this workflow
  # used to run only on things that happen after a commit is already on main —
  # so a pull request breaking any site module merged green and turned the Pages
  # deploy red afterwards, with the tree already broken for everyone. The build
  # job runs on the PR; `deploy` and the artifact upload do not (a fork's token
  # cannot write Pages, and a PR has nothing to publish).
  pull_request:
    paths:
      - 'site/**'
      - 'std/**'
      - 'web/**'
      - 'compiler/**'
      - 'examples/**'
      - '.github/workflows/site.yml'
  schedule:
    # One daily run, as a safety net for a missed trigger.
    - cron: '17 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a superseded build is not worth publishing. Keyed by
# ref rather than a bare `pages`, so a pull-request build cannot cancel the
# main-line deploy it has nothing to do with.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    # A CI run that failed does not get published.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the CLI
        working-directory: compiler
        run: cargo build --release -p vyrn-cli

      - name: The site's own tests
        # The export asserts that every navigation row points at a route that
        # exists and that every route answers as a document AND as data. The
        # other modules check the highlighter, the chart geometry and the
        # repository counts.
        #
        # A GLOB, not a list. The list named thirteen files while `site/app/`
        # held fourteen modules, so `hl.vyrn` (6 test blocks — the highlighter
        # this step's own comment claimed was checked) and `facts.vyrn` (3) ran
        # nowhere. The `fmt` step two steps down already globs; a list of what to
        # check is a list somebody has to remember to add to.
        #
        # And `vyrn test` on a file with no test blocks prints "no tests" and
        # exits 0, so a module that silently stopped being discovered would keep
        # this loop green. The floor is therefore read off the SOURCE — the same
        # rule `compiler/vyrn-cli/tests/std_suite.rs` applies to `std/` — so a
        # block that stops running fails here with both numbers in the message.
        run: |
          set -euo pipefail
          bin=compiler/target/release/vyrn
          total=0
          for f in site/export.vyrn site/app/*.vyrn; do
            declared=$(grep -c '^test "' "$f" || true)
            [ "$declared" -eq 0 ] && continue
            echo "== $f ($declared declared)"
            out=$("$bin" test "$f" 2>&1) || { echo "$out"; exit 1; }
            ran=$(printf '%s' "$out" | sed -n 's/^\([0-9]*\) passed, 0 failed$/\1/p' | tail -1)
            [ "${ran:-0}" -ge "$declared" ] ||
              { echo "$f: $declared blocks declared, ${ran:-0} ran"; echo "$out"; exit 1; }
            total=$((total + ran))
          done
          echo "site: $total test blocks ran"

      - name: The guide's programs
        # Every code block in the guide is a file here, and the export imports
        # and CALLS each one while it renders the pages — so a program that does
        # not compile already fails the build. This runs their own `test` blocks
        # as well, which is the half the export does not exercise.
        run: |
          bin=compiler/target/release/vyrn
          for f in site/guide/*.vyrn; do
            "$bin" test "$f"
          done

      - name: Formatting
        run: compiler/target/release/vyrn fmt --check site/app/*.vyrn site/guide/*.vyrn site/export.vyrn

      - name: The playground module
        # The compiler's own front end, as WebAssembly (`compiler/vyrn-play`).
        # It is EXCLUDED from the workspace and must be built from its own
        # directory: `.cargo/config.toml` there sets the linker's stack size,
        # and cargo reads that file from the working directory upward, so a
        # `--manifest-path` build from elsewhere silently gets wasm-ld's 1 MB
        # default and overflows a tenth of the way to the interpreter's limit.
        #
        # `writeFile` takes a String, so the export cannot copy a wasm module;
        # this one lands straight in the output like the hero's.
        working-directory: compiler/vyrn-play
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown
          mkdir -p ../../out
          cp target/wasm32-unknown-unknown/release/vyrn_play.wasm ../../out/play.wasm
          ls -l ../../out/play.wasm

      - name: The playground's own checks
        # The span offsets, the diagnostics shape and the exit codes, on the
        # host where a failure is readable.
        working-directory: compiler/vyrn-play
        run: cargo test --release

      - name: The hero module
        # `writeFile` takes a String, so the export step cannot copy a wasm
        # module. It is built here instead, straight into the output.
        #
        # `out/docs/std` and `out/guide` are made here too: RFC-0014 has no way
        # to CREATE a directory, and the reference publishes one page per std
        # module while the guide publishes one per chapter.
        run: |
          mkdir -p out/docs/std out/guide
          compiler/target/release/vyrn build examples/herofield.vyrn --target wasm -o out/hero.wasm

      - name: Render every page
        # One `route()` call per path, twice: the document and the soft-
        # navigation payload beside it. The stylesheet, the three site scripts
        # and the three browser runtimes are copied by the same program. The
        # reference pages are read off `std/` by a generator while this runs.
        run: compiler/target/release/vyrn run site/export.vyrn out

      - name: The site, served from somewhere that is not the root
        # The export asserts that every internal link resolves, and used to
        # assert it at a root — which is why the site shipped with `/style.css`
        # on every page and 404ed under `https://vyrn-lang.github.io/vyrn/`.
        # This serves `out/` behind a prefix and FETCHES: every page, every URL
        # every page names, both wasm modules, and every fragment. Three mount
        # points, one of them nested, plus `file://`, and the same artifact each
        # time — nothing is rebuilt between them, which is the claim.
        #
        # It has to run here rather than beside the other node tests in `ci.yml`:
        # what it checks is the exported tree, and this is the job that has one.
        # A glob, so the next file lands in CI by being written.
        run: node --test "site/test/*.test.mjs"

      - uses: actions/upload-pages-artifact@v3
        # Nothing to upload from a pull request — the build IS the check there.
        if: github.event_name != 'pull_request'
        with:
          path: out

  deploy:
    needs: build
    # A pull request builds the site and runs its tests; it does not publish it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
