name: Release

# Nothing here runs until someone pushes a tag. There are no tags in the
# repository today, so this workflow is inert: it has no schedule, no
# `workflow_dispatch` and no branch trigger. Pushing `v0.2.0` builds the three
# binaries and publishes a release; pushing `v0.2.0-rc.1` publishes the same
# thing marked as a pre-release, because the site's install widget offers a
# stable channel and a pre-release channel and reads both from this feed.
on:
  push:
    tags:
      - 'v*'

# The release job writes releases and nothing else.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            name: x86_64-linux
            bin: vyrn
          - os: macos-latest
            name: aarch64-macos
            bin: vyrn
          - os: windows-latest
            name: x86_64-windows
            bin: vyrn.exe
    steps:
      - uses: actions/checkout@v4
      - name: Build the CLI
        working-directory: compiler
        run: cargo build --release -p vyrn-cli
      - name: Stage the archive
        shell: bash
        # One directory per platform holding the binary, the licence-bearing
        # README and the standard library, because `vyrn` resolves `std/…`
        # imports from files on disk.
        run: |
          stage="vyrn-${{ matrix.name }}"
          mkdir -p "$stage"
          cp "compiler/target/release/${{ matrix.bin }}" "$stage/"
          cp README.md "$stage/"
          cp -r std "$stage/std"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$stage.zip" "$stage" > /dev/null
          else
            tar czf "$stage.tar.gz" "$stage"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vyrn-${{ matrix.name }}
          path: |
            vyrn-*.tar.gz
            vyrn-*.zip
          if-no-files-found: error

  publish:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a suffix is a pre-release: `v0.2.0-rc.1` yes, `v0.2.0` no.
        # The site lists both, and marks the pre-release rather than hiding it.
        # `gh` ships on the runner, so this needs no third-party action.
        run: |
          tag="${GITHUB_REF_NAME}"
          flags="--generate-notes --verify-tag"
          case "$tag" in
            *-*) flags="$flags --prerelease" ;;
          esac
          gh release create "$tag" $flags --title "$tag" dist/*
