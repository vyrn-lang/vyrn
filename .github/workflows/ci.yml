name: CI

on:
  # `workflow_dispatch` is the escape hatch release.yml's gate needs: that gate
  # refuses to publish a tag whose commit has no successful CI run, and a
  # docs-only commit (see `paths-ignore`) has no run at all. Re-run CI here
  # against the tagged commit and the release goes through.
  workflow_dispatch:
  push:
    branches: [main]
    # Docs-only commits (RFCs, notes, README) don't need a build.
    #
    # What this makes one-directional, stated rather than left to be discovered:
    # `docs/api/` is generated Markdown and the "Docs drift gate" step below is
    # what keeps it honest — but a commit touching ONLY `docs/api/*.md` matches
    # `**.md` and runs no workflow, so a hand-edit there is not caught until the
    # next commit that does build. Caught late, not never. The alternative —
    # dropping `**.md` — puts a full four-platform matrix plus parity behind
    # every research note, which is a worse trade for a directory nothing reads
    # (`vyrn doc --verify` regenerates it either way).
    paths-ignore:
      - 'rfcs/**'
      - '**.md'
      - 'editor/**'
  pull_request:
    paths-ignore:
      - 'rfcs/**'
      - '**.md'
      - 'editor/**'

# Stacked pushes cancel the superseded run — only the newest commit's
# verdict matters on a branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts bloat the cache and don't help clean CI builds.
  CARGO_INCREMENTAL: 0
  # A missing external tool must FAIL a job here, never skip quietly. The parity
  # harness drops the wasm column with a `NOTE` when `wasmtime` is absent, and the
  # memory census skips whole when `node` is, so a restored-but-empty cache or a
  # renamed release asset reads as green while a third of the gate does not run.
  # `tests/common/mod.rs` and `tests/memory.rs` read this and panic instead.
  VYRN_REQUIRE_TOOLS: "1"
  # THE REGRESSION THRESHOLD, in one place. `vyrn bench --compare` calls a bench
  # regressed when its `min` exceeds `baseline min * BENCH_THRESHOLD`.
  #
  # 2.0, chosen against the noise rather than against a wish:
  #
  #   * The statistic compared is the MINIMUM of >= 31 samples, each auto-scaled
  #     to take >= 1 ms. A preempted sample on a shared runner raises the mean and
  #     the median; it cannot lower the minimum. Most of the noise is already gone
  #     before the comparison starts.
  #   * What remains is not run-to-run jitter but FLEET spread: `ubuntu-latest` is
  #     several CPU models under one label, and a scheduler that hands out a
  #     different one shifts every row at once. A margin that a fleet change can
  #     cross turns main red for a reason no commit caused, and a gate that cries
  #     wolf gets switched off — which is worse than a loose one.
  #   * The regressions this project has actually had are not marginal. Census P1
  #     was 52x, the fixed-array element read was 8x, and the module-state append
  #     spine was unbounded. A 2x margin catches all of them with room to spare.
  #
  # Lower it once the `bench-json` artifacts show what the real spread between
  # consecutive main runs is. Do not raise it without the same evidence.
  BENCH_THRESHOLD: "2.0"

jobs:
  test:
    name: tests (workspace + LSP) — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # The opposite of the release matrix's setting, for the opposite reason:
      # there a partial matrix must not publish, so the first failure cancels the
      # rest. Here the whole point is to learn WHICH platforms are broken. One
      # red leg cancelling the other three would hide a second bug behind the
      # first and cost another round trip to find it.
      fail-fast: false
      matrix:
        # The platforms release.yml ships, and only those: every published binary
        # is now built by a machine whose tests ran. Before this, no test had
        # ever executed on macOS, and Windows was covered only by the
        # maintainer's dev machine — informally, and never on a pull request.
        #
        # This is the cheap tier on purpose: pure Rust, no clang, no wasi
        # sysroot, no wasmtime download. The expensive jobs below stay on
        # ubuntu-latest, where a second architecture buys little — `layout_vs_
        # clang` compiles for wasm32-wasip1, so the HOST architecture does not
        # change the ABI it verifies.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    defaults:
      run:
        # Every step below is a POSIX shell script — `set -e`, `$(…)`, `for f
        # in`. windows-latest defaults to pwsh, which parses none of it. Git Bash
        # ships on that runner and brings `grep` with it, so one line here keeps
        # the four legs running byte-identical scripts instead of forking every
        # step on `runner.os`.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Rust cache
        # Unlike actions/cache with a lockfile key (which never re-uploads
        # after the first hit, so every run rebuilt all vyrn-* crates from a
        # stale target), rust-cache refreshes the saved target dir per run
        # and prunes stale artifacts.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            compiler
            compiler/vyrn-lsp
      - name: Formatting gate
        # First, because it is seconds and its fix is mechanical — a reader gets
        # the verdict before the build spends five minutes.
        #
        # Three manifests, not one: `vyrn-lsp` and `vyrn-genwasm` are excluded
        # from the workspace (see compiler/Cargo.toml), so `cargo fmt` at the
        # root never reaches them. An excluded crate is exactly the kind that
        # drifts unwatched.
        #
        # rustfmt's defaults, with no rustfmt.toml: every crate is edition 2021,
        # so style_edition is 2021 and the defaults are frozen by rustfmt's own
        # stability promise. Nothing here needs configuring.
        working-directory: compiler
        run: |
          cargo fmt --check
          cargo fmt --check --manifest-path vyrn-lsp/Cargo.toml
          cargo fmt --check --manifest-path vyrn-genwasm/Cargo.toml
      - name: Workspace tests
        working-directory: compiler
        run: cargo test --quiet
      - name: Browser runtime tests (web/)
        # The zero-dependency JavaScript beside the compiler gets the same gate.
        # node:test is in the runner's Node already, so this adds no install.
        run: node --test "web/test/*.test.mjs"
      - name: LSP tests (excluded crate)
        working-directory: compiler
        run: cargo test --quiet --manifest-path vyrn-lsp/Cargo.toml
      - name: Docs drift gate (RFC-0065)
        # The committed std API docs (docs/api/) must match what `vyrn doc`
        # generates from std/ — regenerated in the same commit as any std doc
        # change. Cheap (no clang): --verify writes nothing and exits 1 on drift.
        working-directory: compiler
        run: cargo run --quiet -p vyrn-cli -- doc --std -o ../docs/api --verify
      - name: The install script installs, and refuses what it cannot verify
        if: runner.os != 'Windows'
        # `install.sh` and `install.ps1` were executed by NOTHING — including the
        # checksum refusal the README advertises and the release notes point at.
        # The harness serves a fake release over a local python `http.server`
        # (the `VYRN_REPO`/`VYRN_DOWNLOAD` hooks the script's own header says are
        # "used by the test harness"), so it needs no network and no release.
        run: sh install-test.sh
      - name: The install script installs, and refuses what it cannot verify
        if: runner.os == 'Windows'
        # Windows PowerShell rather than the job's bash default: `install.ps1` is
        # what the documented `irm | iex` line runs, so it is what gets executed.
        shell: powershell
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File install-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bench --check (deterministic, RFC-0063)
        # The BLOCKING half of bench-in-CI: `vyrn bench --check` runs each bench
        # body ONCE under the interpreter — deterministic, no clang, no timing —
        # so a bench that stops compiling/running fails the build. The corpus is
        # every example carrying `bench "` (benching, smallarray, and any future
        # one), discovered here exactly as the RFC specifies.
        working-directory: compiler
        run: |
          set -eu
          corpus=$(grep -rl 'bench "' ../examples --include='*.vyrn' | sort)
          [ -n "$corpus" ] || { echo "no bench corpus found under examples/" >&2; exit 1; }
          echo "bench corpus:"; echo "$corpus"
          for f in $corpus; do
            echo "== vyrn bench --check $f =="
            cargo run --quiet -p vyrn-cli -- bench "$f" --check
          done

  parity:
    name: three-way parity (interp == native == wasm)
    # x86-64 only, on purpose, and here is the case for the ARM leg that is NOT
    # here so the next reader does not have to rebuild it.
    #
    # What an `ubuntu-24.04-arm` copy of this job would NOT add: a second layout
    # ABI. `vyrn-codegen/tests/layout_vs_clang.rs` compiles for wasm32-wasip1 and
    # runs under wasmtime — the host architecture changes neither the target nor
    # the answer. (That citation was a claim when it was written: the test
    # early-returned in every job for want of a toolchain. It executes in THIS
    # job now — see the codegen step below — so the argument rests on something
    # that has been watched go green.) The layout engine exists for the direct wasm backend; on the
    # native path LLVM computes layout, so there is nothing of ours to diverge.
    # The SIMD types are the same story: `<4 x float>` lowers to wasm SIMD in the
    # column this engine owns.
    #
    # What it WOULD add: the NATIVE column on aarch64. That column is text IR
    # through clang to a real binary, and the harness compares its stdout byte
    # for byte against the interpreter — so it is a genuine second ABI for
    # everything the emitter decides (integer widths, float formatting, struct
    # returns, trap wording).
    #
    # What it would cost, measured against run 31724777591 (warm caches): this
    # job takes about 8 minutes and runs in parallel with the others, so the
    # added WALL time is zero and the added runner minutes are free — the repo
    # is public. The one-time work is a second cache slot and the aarch64
    # wasmtime asset (`wasmtime-v46.0.1-aarch64-linux.tar.xz`); the wasi sysroot
    # and the builtins archive are wasm32 target libraries and are the same file
    # on every host. clang is preinstalled on the ARM image.
    #
    # A cheap, real addition — deliberately left as its own change, because a
    # matrix leg nobody has watched go green is a claim, not a gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          # Separate cache from the test job — different build graph (only
          # vyrn-cli's parity test) and keeps both under the size cap.
          prefix-key: parity
      - name: wasm toolchain cache
        id: wasm-tools
        # The ONLY job that fetches this now. It was shared with gen-engine,
        # which exported WASI_SYSROOT/WASI_BUILTINS that nothing in its build
        # read — RFC-0076 M7 moved the shim to the direct backend and left the
        # exports behind.
        #
        # All three pieces are live HERE, and each for a different step: the
        # parity harness needs wasmtime (RFC-0077 M5 made `--target wasm` need
        # no clang, no sysroot and no builtins), and the codegen integration
        # tests below need the sysroot and the builtins archive to compile the
        # C shim and the layout program.
        uses: actions/cache@v4
        with:
          path: ~/wasm-tools
          key: wasm-tools-wasi25-wasmtime46
      - name: Fetch wasi-sysroot + builtins + wasmtime
        if: steps.wasm-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/wasm-tools && cd ~/wasm-tools
          curl -sSfL -o sysroot.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sysroot-25.0.tar.gz
          curl -sSfL -o builtins.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/libclang_rt.builtins-wasm32-wasi-25.0.tar.gz
          curl -sSfL -o wasmtime.tar.xz https://github.com/bytecodealliance/wasmtime/releases/download/v46.0.1/wasmtime-v46.0.1-x86_64-linux.tar.xz
          tar xf sysroot.tar.gz && tar xf builtins.tar.gz && tar xf wasmtime.tar.xz
      - name: Run the parity harness
        working-directory: compiler
        # WASI_SYSROOT and WASI_BUILTINS are deliberately NOT exported: the wasm
        # column is emitted directly, and leaving them unset is what makes this run
        # evidence for M5's acceptance criterion rather than a claim about it. clang
        # is still needed, for the NATIVE column.
        run: |
          export VYRN_WASMTIME=$(find ~/wasm-tools -type f -name wasmtime | head -1)
          echo "wasmtime: $VYRN_WASMTIME"
          cargo test --quiet -p vyrn-cli --test parity -- --ignored --nocapture
      - name: The codegen integration tests that need a toolchain (RFC-0077)
        working-directory: compiler
        # THE JOB THAT MAKES `layout_vs_clang` A GATE. These eight tests —
        # `layout_vs_clang` 1, `shim_link` 2, `wasm_runs` 5 — need wasmtime, and
        # three of them need clang and the wasi sysroot as well. They used to be
        # ordinary `#[test]`s that early-`return`ed when a tool was missing, and
        # NO job supplied one, so all eight passed in every run having executed
        # nothing — while the parity job's own comment above cited
        # `layout_vs_clang` as the reason an ARM leg would add nothing.
        #
        # They are `#[ignore]`d now — the four-platform test job counts them
        # `1 ignored` / `2 ignored` / `5 ignored` instead of green (the `--quiet`
        # formatter prints the count, not the reason string; drop `--quiet` to
        # read it) — and they run here, the one place
        # with clang, the sysroot, the builtins archive and wasmtime together.
        # `VYRN_REQUIRE_TOOLS=1` from `env:` above is what makes a missing tool a
        # panic rather than a skip, so a broken cache fails this step.
        #
        # This is also the live consumer of WASI_SYSROOT/WASI_BUILTINS: the shim
        # compile (`toolchain::shim_wasm`) and the C layout program are the only
        # readers left in the repo, which is why the fetch stays in THIS job and
        # left the gen-engine one.
        run: |
          export VYRN_WASMTIME=$(find ~/wasm-tools -type f -name wasmtime | head -1)
          export WASI_SYSROOT=$(echo ~/wasm-tools/wasi-sysroot-*)
          export WASI_BUILTINS=$(find ~/wasm-tools -name 'libclang_rt.builtins-wasm32.a' | head -1)
          for v in VYRN_WASMTIME WASI_SYSROOT WASI_BUILTINS; do
            eval "p=\$$v"
            [ -e "$p" ] || { echo "$v is not a path that exists: '$p'" >&2; exit 1; }
            echo "$v=$p"
          done
          cargo test --quiet -p vyrn-codegen -- --ignored --nocapture
      - name: Universal-pages integration (RFC-0069)
        # Ignored-tier like parity: spawning the bin server generates the whole
        # app cold (minutes in a debug build) — too slow for the test job.
        working-directory: compiler
        run: cargo test --quiet -p vyrn-cli --test universal_pages -- --ignored

  gen-engine:
    name: cross-engine generation (interp == wasm)
    # Its own job rather than a step in `test`: it is the only thing in CI that
    # builds wasmtime + cranelift, which is minutes of compile the other jobs
    # must not wait on or share a cache with. Parallel to `parity`, and for the
    # same reason — both are the expensive tier that proves an invariant.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          # Distinct build graph (vyrn-genwasm and its wasmtime tree) — its own
          # slot, like parity's.
          prefix-key: genwasm
      # No wasm toolchain here, deliberately. This job used to restore the same
      # ~/wasm-tools cache as parity and export WASI_SYSROOT/WASI_BUILTINS into
      # the test — three tarballs (~150 MB unpacked) for two variables NOTHING
      # in this build reads. RFC-0076 M7 moved the generation engine's shim to
      # the direct backend (`vyrn-genwasm/src/lib.rs`), which needs no clang and
      # no sysroot, and its wasmtime is a crate rather than a spawned binary. The
      # only readers of those two variables left in the repo are the codegen
      # integration tests, which run in the parity job where the fetch now lives.
      - name: Every generator agrees under both engines (RFC-0076)
        # The RFC's acceptance criteria, both halves in one run: the wasm column
        # must match the interpreter column byte for byte over every
        # generator-using example, and the interpreter column IS the
        # `VYRN_NO_WASM_GEN=1` configuration, so "the interpreter still works with
        # the wasm path disabled" is exercised by the same corpus.
        #
        # `--release` because cranelift compiles the guest: measured over this
        # corpus with an empty artifact cache, 20 s release against 98 s debug.
        working-directory: compiler
        run: |
          cargo test --quiet -p vyrn-cli --release --features wasm-gen \
            --test genwasm -- --ignored --nocapture

  bench:
    name: benchmarks (regression gate)
    # Push-to-main only: timing on shared PR runners is noise, and the trend
    # record only makes sense against the main line. So this is a tripwire on the
    # main line, not a pre-merge check — a regression is reported after the merge
    # that caused it, against the one hardware line the baseline was taken from.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        # The test job sets this and this one did not, so its corpus discovery
        # (`corpus=$(grep -rl ...)`) degraded to an empty loop where the test
        # job's identical line fails — one shell contract, two answers. The
        # explicit `set -eu` plus the non-empty check below is the belt; this is
        # the braces.
        shell: bash
    # WHAT THIS GATE PROVES TODAY: that every bench in the corpus still builds,
    # runs and produces a report. NOT that nothing regressed.
    #
    # `bench/baseline.json` is still a placeholder (`placeholder: true`, empty
    # `benches`), so `--compare` reports every bench `new` and exits 0. And the
    # loop compares ONE example's benches against the whole-corpus baseline, so
    # once a baseline IS seeded every other example's entries come back
    # `missing-from-run` on every iteration — a verdict `bench_verdicts`
    # deliberately does not count as a regression (`vyrn-cli/src/main.rs`), which
    # is right here and means a DELETED bench is invisible to this loop. Seeding
    # the baseline turns the regression half on; catching a deleted bench needs
    # the comparison to be whole-corpus rather than per-example, and is not
    # something `continue-on-error` or a threshold can fix.
    #
    # `continue-on-error` is deliberately GONE all the same: a step that cannot
    # fail for an unrelated reason either is not worth running.
    steps:
      - uses: actions/checkout@v4
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          # Separate cache slot (only vyrn-cli, and a distinct build graph).
          prefix-key: bench
      - name: Build vyrn
        working-directory: compiler
        # clang is preinstalled on ubuntu-latest (the parity job's native half
        # relies on it too); `vyrn bench` finds it on PATH.
        run: cargo build --quiet -p vyrn-cli
      - name: Run benches + compare to baseline
        working-directory: compiler
        run: |
          set -eu
          vyrn=target/debug/vyrn
          corpus=$(grep -rl 'bench "' ../examples --include='*.vyrn' | sort)
          # A discovery pattern that stops matching must fail, not iterate zero
          # times: an empty loop reports the same green as a clean corpus.
          [ -n "$corpus" ] || { echo "no bench corpus found under examples/" >&2; exit 1; }
          echo "bench corpus:"; echo "$corpus"
          mkdir -p ../bench/out
          regressed=0
          for f in $corpus; do
            stem=$(basename "$f" .vyrn)
            echo "== $stem =="
            # The trend record, and the raw material the seedable baseline is
            # assembled from below. Always produced, always uploaded.
            "$vyrn" bench "$f" --json > "../bench/out/$stem.json"
            # The gate. A nonzero exit here fails the job.
            "$vyrn" bench "$f" --compare ../bench/baseline.json \
              --threshold "$BENCH_THRESHOLD" || regressed=1
          done
          exit $regressed
      - name: Assemble a seedable baseline
        # Seeding must be a download-and-commit, never a hand edit. `--json` is
        # per-example, and `bench/baseline.json` is one document over the whole
        # corpus, so the merge happens HERE — where the numbers were measured —
        # rather than in a maintainer's editor. The output is byte-for-byte what
        # `bench/baseline.json` should contain.
        #
        # `backend` and `opt` come from the first report; every report in a run
        # carries the same pair (`native` / `O2`). Bench names are unique across
        # the corpus, which `no_two_benches_in_the_corpus_share_a_name` pins —
        # `--compare` matches on the name alone, so a clash would silently compare
        # one bench against another's timing.
        #
        # Written through a temp file: the glob must not pick up its own output.
        if: always()
        run: |
          python3 -c "import glob, json; rs = [json.load(open(p)) for p in sorted(glob.glob('bench/out/*.json'))]; json.dump({'backend': rs[0]['backend'], 'opt': rs[0]['opt'], 'benches': [b for r in rs for b in r['benches']]}, open('bench/merged.tmp', 'w'), indent=2)"
          mv bench/merged.tmp bench/out/baseline.json
          python3 -c "import json; print('seedable baseline:', len(json.load(open('bench/out/baseline.json'))['benches']), 'benches')"
      - name: Upload bench reports + the seedable baseline
        # `bench-json` holds the per-example trend record AND `baseline.json`.
        # To seed the real baseline: open this run, download `bench-json`, and
        #   cp baseline.json bench/baseline.json && git commit
        # That is the whole procedure — see the `_readme` in the placeholder.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-json
          path: bench/out/*.json
