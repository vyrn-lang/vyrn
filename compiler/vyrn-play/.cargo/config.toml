# The stack this module needs is the COMPILER's now, not a program's.
#
# It used to be a program's: the tree-walking interpreter ran inside this module
# and recursed once per Vyrn call at ~8.5 KB a frame, so the deepest program the
# language permits — `CALL_DEPTH_LIMIT`, 1,000 frames — needed ~8.5 MB of linear
# stack. RFC-0125 M5 moved the running out: `play_compile` answers a module and
# the page runs it (`site/public/play-worker.js`), so what recurses in here is
# the parser, the checker and the backend, over the syntax of one file.
#
# wasm-ld's default is 1 MB and this is 16, because that is the number the
# measurement above bought and there is no reason yet to spend a day finding a
# smaller one: it is the module's INITIAL MEMORY, which the page pays for once,
# and the deep-nesting programs that reach it are the ones a reader types into a
# playground on purpose. The stack sits at the bottom of linear memory, where an
# overflow traps instead of writing over the heap (`--stack-first`, which rustc
# passes for this target), and `play-worker.js` catches the engine's `RangeError`
# and says whose ceiling it was.
#
# Cargo reads this file from the working directory upward, so it only applies to
# builds started in `compiler/vyrn-play`. See the note in Cargo.toml.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=-zstack-size=16777216"]
