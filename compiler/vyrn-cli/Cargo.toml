[package]
name = "vyrn-cli"
version = "0.0.0"
edition = "2021"
description = "The vyrn driver: check, run (interpret), or emit LLVM IR for a .vyrn file."

[dependencies]
vyrn-frontend = { path = "../vyrn-frontend" }
vyrn-codegen = { path = "../vyrn-codegen" }
# RFC-0076: the embedded wasm engine that runs generators. OPTIONAL and off by
# default, so `cargo build` and `cargo test` keep working with no external
# dependency — the property the default workspace members were chosen for. The
# dependency lives here rather than in `vyrn-frontend` because compiling a
# generator to wasm needs codegen and clang, which only the driver has; the
# frontend just exposes the seam.
wasmtime = { version = "47", optional = true, default-features = false, features = ["cranelift", "runtime", "std"] }

[features]
# `cargo build --features wasm-gen` opts into running generators as compiled
# wasm instead of interpreting them.
wasm-gen = ["dep:wasmtime"]

[[bin]]
name = "vyrn"
path = "src/main.rs"
