[package]
name = "vyrn-cli"
# What `vyrn --version` prints, and what the release workflow checks its tag
# against. The other workspace crates stay 0.0.0: they are not published and
# nothing reads their version. Bump this WITH the tag, or the release fails
# before it builds.
version = "0.1.0-alpha.3"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The vyrn driver: check, run (interpret), or emit LLVM IR for a .vyrn file."

[dependencies]
vyrn-frontend = { path = "../vyrn-frontend" }
vyrn-lower = { path = "../vyrn-lower" }
vyrn-codegen = { path = "../vyrn-codegen" }
# RFC-0076: the embedded wasm engine that runs generators. An EXCLUDED crate
# (it pulls in `wasmtime`), depended on OPTIONALLY, so `cargo build` and
# `cargo test` keep resolving to path dependencies only — the property the
# default workspace members were chosen for.
vyrn-genwasm = { path = "../vyrn-genwasm", optional = true }
# RFC-0125 M5: `vyrn run --engine wasm` runs the program's wasm in this process.
# The same crate, version and features `vyrn-genwasm` embeds, so a build with
# `wasm-gen` on compiles it once. What the workspace defends is "builds and
# tests with no LLVM, clang or sysroot" (../Cargo.toml), and this is pure Rust.
wasmtime = { version = "47", default-features = false, features = [
    "cranelift",
    "runtime",
    "std",
    "parallel-compilation",
] }

[features]
# `cargo build --features wasm-gen` opts into running generators as compiled
# wasm instead of interpreting them.
#
# STILL OFF by default, and no longer for the reason it was: RFC-0076 M7 emits
# the generator's module directly, so the engine needs no clang and no wasi
# sysroot, and its dependencies are ones this binary already resolves. What
# keeps it off is a DEFECT (RFC-0125 §3 M5, the ninth slice): a generator that
# refuses through `std/diag`'s `reportHere` and returns its report beside a
# `vyrn"…"` code quote comes back corrupted — `tests/exports.rs`'s
# `graphql_sdl_answers_the_awkward_contract..` is the reproduction. The
# interpreter answers it correctly, so it stays the default until the splice is
# fixed. `vyrn-lsp` turns the feature on and has this defect today.
wasm-gen = ["dep:vyrn-genwasm"]

# The host the compiled route runs in, and nothing else (see src/lib.rs).
# `vyrn-frontend` dev-depends on it so its tests run a program the way the
# driver does (RFC-0125 §3 M5, the `library-run` row).
[lib]
name = "vyrn_cli"
path = "src/lib.rs"

[[bin]]
name = "vyrn"
path = "src/main.rs"
