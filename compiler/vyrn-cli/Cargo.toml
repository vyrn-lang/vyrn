[package]
name = "vyrn-cli"
version = "0.0.0"
edition = "2021"
description = "The vyrn driver: check, run (interpret), or emit LLVM IR for a .vyrn file."

[dependencies]
vyrn-frontend = { path = "../vyrn-frontend" }
vyrn-codegen = { path = "../vyrn-codegen" }
# RFC-0076: the embedded wasm engine that runs generators. An EXCLUDED crate
# (it pulls in `wasmtime`), depended on OPTIONALLY, so `cargo build` and
# `cargo test` keep resolving to path dependencies only — the property the
# default workspace members were chosen for.
vyrn-genwasm = { path = "../vyrn-genwasm", optional = true }

[features]
# `cargo build --features wasm-gen` opts into running generators as compiled
# wasm instead of interpreting them.
wasm-gen = ["dep:vyrn-genwasm"]

[[bin]]
name = "vyrn"
path = "src/main.rs"
