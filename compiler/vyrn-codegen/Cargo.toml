[package]
name = "vyrn-codegen"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Emits code for Vyrn: textual LLVM IR today, wasm directly (in progress)."

[dependencies]
vyrn-frontend = { path = "../vyrn-frontend" }
# RFC-0101: the lowered form, which sits BELOW this crate. The edge is one way
# and stays one way — `vyrn-lower` must not see a backend. `check_instantiations`
# is the first reader (M2b): the monomorphization worklist is the lowering's, so
# asking how deep it goes no longer means emitting a module and throwing it away.
vyrn-lower = { path = "../vyrn-lower" }
# The direct wasm backend, which replaces `--target wasm`'s trip through clang.
# Section framing and LEB128 are not where the interesting bugs live, and this is
# the Bytecode Alliance's own encoder — the same org as the `wasmtime` this repo
# already runs generators on, so it tracks the format from the same source.
#
# It is the first external crate in the default resolve. The property that
# matters — `cargo build` and `cargo test` with no LLVM, no clang, no wasi
# sysroot — is untouched by it; see ../Cargo.toml.
wasm-encoder = "0.221"
# The same module, printed as text (`vyrn emit-wat`). The encoder's own family,
# pinned to the encoder's version so the two never read the format differently.
# `default-features = false` drops the component-model printer: this backend
# emits core modules only.
#
# It is what gives the direct backend the thing the textual one has had all
# along — a form a test can READ, so a property proved by grepping `emit-ir`
# can be proved on both compiled backends instead of one.
wasmprinter = { version = "0.221", default-features = false }

[lib]
name = "vyrn_codegen"
path = "src/lib.rs"
