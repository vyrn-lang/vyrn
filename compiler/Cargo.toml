# Vyrn compiler workspace.
#
#   - vyrn-frontend : lexer + parser + AST + type checker + tree-walking interpreter
#   - vyrn-lower    : the lowered form (RFC-0101) — the checker's answers, written down
#   - vyrn-codegen  : emits code (textual LLVM IR today; wasm directly, in progress)
#   - vyrn-cli      : the `vyrn` driver
#
# THE PROPERTY WORTH DEFENDING: `cargo build` and `cargo test` work on a machine
# with no LLVM, no clang and no wasi sysroot. A contributor can hack on the
# frontend, the checker and the interpreter — and run the whole test suite —
# without installing a C toolchain. Anything that would break THAT is excluded.
#
# What is NOT a rule, though an earlier version of this comment implied it was:
# "no external crates". That was generalized out of the sentence above, where it
# does not follow — a Rust crate has nothing to do with whether clang is
# installed. Crates are judged one at a time, on what they cost and what a
# self-hosted Vyrn would have to do about them later.
#
# `vyrn-lsp` and `vyrn-genwasm` are EXCLUDED because they are heavy and neither
# is needed to build or test the language: `lsp-server`/`lsp-types` for the
# former, the generator engine for the latter (RFC-0076). `vyrn-cli` and
# `vyrn-lsp` depend on `vyrn-genwasm` OPTIONALLY, behind a feature spelled
# `wasm-gen` in each, so it enters the resolve only when asked for.
#
# `wasmtime` itself is in the default resolve since RFC-0125 M5: `vyrn-cli`
# embeds it to run a program's wasm (`vyrn run --engine wasm`). It is pure
# Rust, so the property above holds; what it costs the build is recorded in
# RFC-0125 §3 M5.
#   cargo build --manifest-path compiler/vyrn-lsp/Cargo.toml
#
# `vyrn-play` is EXCLUDED for a different reason: it only makes sense for one
# target (`wasm32-unknown-unknown`, the website's playground) and nothing depends
# on it. It also has to be built from its OWN directory, so the linker stack size
# in `vyrn-play/.cargo/config.toml` applies:
#   cd compiler/vyrn-play && cargo build --release --target wasm32-unknown-unknown

[workspace]
resolver = "2"
members = [
    "vyrn-frontend",
    "vyrn-lower",
    "vyrn-codegen",
    "vyrn-cli",
]
exclude = [
    "vyrn-lsp",
    "vyrn-genwasm",
    "vyrn-play",
]

[profile.dev]
# Full debuginfo, for a workspace of 54 test targets, is the single most
# expensive thing about `cargo test`. MEASURED both places it is paid — `cargo
# test --no-run` from `cargo clean`, median of three runs:
#
#                                Windows/MSVC     ubuntu-latest
#   default (debug = 2)             19.6 s           24.5 s
#   debug = "line-tables-only"      14.7 s  -25%     19.3 s  -21%
#
# What it costs: a debugger can no longer show local variables or struct fields.
# What it does not cost: a panic backtrace. `line-tables-only` keeps exactly the
# file:line mapping a backtrace resolves, and the two configurations print a
# BYTE-IDENTICAL backtrace for the same panic — checked, not assumed. Test
# failures are the debuginfo this project actually reads.
#
# Set `debug = 2` locally (or `CARGO_PROFILE_DEV_DEBUG=2`) for a stepping
# session; nothing else in the build depends on this.
#
# FASTER LINKERS WERE MEASURED AND DECLINED, on both platforms, so nobody has
# to measure them again. Same three reps, same clean builds:
#
#   Windows: rust-lld       21.6 s   +2.0 s vs default   (SLOWER)
#            rust-lld + ltl 15.6 s   +0.9 s vs ltl alone (SLOWER)
#   Linux:   mold 2.30      24.9 s   +0.4 s vs default   (SLOWER)
#            mold + ltl     21.1 s   +1.9 s vs ltl alone (SLOWER)
#
# Both link correctly. Neither is the bottleneck: this workspace has one
# external crate and 57 small executables, so per-link startup costs more than
# the link saves. `mold` would also have been an answer for one leg of a
# four-platform matrix — it has no Windows and no macOS port.
#
# The default `clang` linker for `vyrn build` is likewise NOT pinned to
# `-fuse-ld=lld`. It would make the linker uniform across the three platforms,
# but `vyrn build`'s only stated requirement is "clang on PATH", and on Linux
# `lld` is a separate package — pinning it turns a working install into a
# broken one. It would not buy reproducibility on its own either: a PE
# timestamp needs `-Wl,/Brepro` and a Mach-O UUID needs `-Wl,-no_uuid`,
# regardless of which linker runs.
debug = "line-tables-only"

[profile.release]
opt-level = 3
