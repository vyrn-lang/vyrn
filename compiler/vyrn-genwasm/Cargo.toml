[package]
name = "vyrn-genwasm"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "RFC-0076: runs `gen fn` generators as compiled wasm in an embedded wasmtime."

# NOT a member of the default workspace (see ../Cargo.toml `exclude`): nothing
# needs its test suite to build or test the language. It IS in the default
# resolve, because both consumers turn `wasm-gen` on by default — `vyrn-lsp`
# always did, and `vyrn-cli` since RFC-0125 §3 M5's tenth slice, so every command
# runs a `gen fn` the way a keystroke in the editor already did.
[dependencies]
vyrn-frontend = { path = "../vyrn-frontend" }
vyrn-codegen = { path = "../vyrn-codegen" }
wasmtime = { version = "47", default-features = false, features = [
    "cranelift",
    "runtime",
    "std",
    # Cranelift compiles a module's functions on a thread pool. It is a wasmtime
    # DEFAULT feature, so `default-features = false` silently turned it off and
    # every artifact was compiled single-threaded — measured at 1,055 ms across a
    # cold open's five artifacts against 250 ms with it on.
    "parallel-compilation",
] }

[lib]
name = "vyrn_genwasm"
path = "src/lib.rs"
