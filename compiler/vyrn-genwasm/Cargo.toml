[package]
name = "vyrn-genwasm"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Runs `gen fn` generators as compiled wasm in an embedded wasmtime."

# NOT a member of the default workspace (see ../Cargo.toml `exclude`): nothing
# needs its test suite to build or test the language. It IS in the default
# resolve, and in both consumers (`vyrn-cli`, `vyrn-lsp`) unconditionally: there
# is one generation engine and it is this one.
[dependencies]
vyrn-frontend = { path = "../vyrn-frontend" }
vyrn-lower = { path = "../vyrn-lower" }
vyrn-codegen = { path = "../vyrn-codegen" }
wasmtime = { version = "47", optional = true, default-features = false, features = [
    "cranelift",
    "runtime",
    "std",
    # Cranelift compiles a module's functions on a thread pool. It is a wasmtime
    # DEFAULT feature, so `default-features = false` silently turned it off and
    # every artifact was compiled single-threaded — measured at 1,055 ms across a
    # cold open's five artifacts against 250 ms with it on.
    "parallel-compilation",
] }

# `host` is the embedded wasmtime engine. Without it the crate is the half a
# host without wasmtime reuses: the wrapper program, the decoders and the atom
# encoding, driven by `run_pure` (the playground's engine).
[features]
default = ["host"]
host = ["dep:wasmtime"]

[lib]
name = "vyrn_genwasm"
path = "src/lib.rs"
